name: cleanyourtv

services:
  preview:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-u", ".base44/preview/server.py"]
    restart: on-failure
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
      - PORT=3000
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:3000/", timeout=5).read()
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 10s
    labels:
      base44.project: "CleanYourTV"
      base44.kind: "web"
      base44.port: "3000"

  tools:
    image: python:3.12-slim
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        python -m venv tools/venv
        tools/venv/bin/pip install --disable-pip-version-check --no-input -q -r tools/requirements.txt
        exec sleep infinity
    restart: on-failure
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
      - PIP_DISABLE_PIP_VERSION_CHECK=1
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "tools/venv/bin/python", "-c", "import adb_shell, rsa, cryptography"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 150s
    labels:
      base44.project: "CleanYourTV tools"
      base44.kind: "worker"
